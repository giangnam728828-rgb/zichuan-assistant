name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: '3.50.1'
        cache: true

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y zstd xz-utils curl ninja-build

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: |
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

    - name: Assemble arm64 runtime
      run: bash runtime/build-runtime.sh arm64-v8a

    - name: Build signed APK
      # build-apk.sh reads keystore/keystore.properties (tracked) when no env
      # secrets are set; signing material is never printed to the log.
      run: bash build-apk.sh

    - name: Verify signature
      run: |
        APK=$(ls dist/zichuan-assistant-*.apk | head -1)
        $ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner verify --print-certs "$APK" | grep 'SHA-256'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: zichuan-assistant-arm64
        path: dist/zichuan-assistant-*.apk
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/zichuan-assistant-*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
