name: Android CI

# Tag 构建要创建 Release 并挂 APK：仓库默认 workflow 权限是 read，
# 不显式声明的话 softprops/action-gh-release 会 403（Resource not accessible）。
permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      # Runners have ~14GB; Flutter + NDK + 530MB runtime + APK need more.
      # Clear preinstalled toolchains we do not use (keep Android + JDK + Flutter).
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        java: false
        large-packages: true
        docker-images: true
        node: true
        php: true
        python: true
        rust: true
        ruby: true
        scala: true
        swap-storage: false

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: '3.50.1'
        cache: true

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y zstd xz-utils curl ninja-build

    - name: Install Android SDK packages
      # Locate sdkmanager from the preinstalled cmdline-tools (not always on PATH).
      run: |
        SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
        echo "sdkmanager: $SDKMGR"
        echo "$SDKMGR" | grep -q . || { echo "sdkmanager not found"; exit 1; }
        BIN=$(dirname "$SDKMGR")
        echo "$BIN" >> "$GITHUB_PATH"
        yes | "$SDKMGR" --licenses > /dev/null || true
        "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
        # Ensure ANDROID_NDK_HOME points to the pinned version for tawcroot
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

    - name: Assemble arm64 runtime
      timeout-minutes: 45
      run: bash runtime/build-runtime.sh arm64-v8a

    - name: Build tawcroot native lib
      timeout-minutes: 20
      run: python3 -I runtime/tawcroot/build.py

    - name: Restore signing key
      # 签名材料不进仓库：从 Secrets 还原到工作目录，构建结束随 runner 销毁。
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        [ -n "$KEYSTORE_BASE64" ] || { echo "缺少 KEYSTORE_BASE64 secret" >&2; exit 1; }
        mkdir -p keystore
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/zichuan-release.jks
        test -s keystore/zichuan-release.jks || { echo "keystore 还原失败" >&2; exit 1; }
        echo "keystore restored: $(wc -c < keystore/zichuan-release.jks) bytes"

    - name: Build signed APK
      # 签名参数全部走环境变量，不落盘、不进日志（不要再用 bash -x）。
      # DSH_MAVEN_MIRRORS=0: GitHub runners reach google()/mavenCentral() fast;
      # the Aliyun mirrors the project defaults to are slow from the US.
      # apksigner lives in build-tools; expose it to build-apk.sh's verify step.
      timeout-minutes: 70
      env:
        DSH_MAVEN_MIRRORS: '0'
        KEYSTORE: ${{ github.workspace }}/keystore/zichuan-release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
        export APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
        bash build-apk.sh

    - name: Verify signature
      # 硬门槛：v1/v2 必须在，v3 必须不在。
      run: |
        APK=$(ls dist/zichuan-assistant-*.apk | head -1)
        echo "APK: $APK ($(du -h "$APK" | cut -f1))"
        AS="$ANDROID_HOME/build-tools/36.0.0/apksigner"
        "$AS" verify --verbose --min-sdk-version 21 --print-certs "$APK" > /tmp/verify.txt
        grep 'SHA-256' /tmp/verify.txt
        grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/verify.txt
        grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/verify.txt
        if grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/verify.txt; then
          echo "v3 signature present: 与签名约定不一致" >&2
          exit 1
        fi
        echo "OK: v1 + v2, no v3"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: zichuan-assistant-arm64
        path: dist/zichuan-assistant-*.apk
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/zichuan-assistant-*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
