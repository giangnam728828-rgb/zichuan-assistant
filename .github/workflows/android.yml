name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build-apk.sh'
      - 'keystore/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名（如 1.0.2）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android build-tools 34 与 platform 34
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK"
          echo "yes" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "build-tools;34.0.0" "platforms;android-34" >/dev/null
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: 版本号
        id: v
        run: |
          NAME="${{ inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME="1.0.${{ github.run_number }}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "版本 $NAME (code ${{ github.run_number }})"

      - name: 构建 + 固定签名
        env:
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_SDK }}/build-tools/34.0.0
          AAPT: ${{ env.ANDROID_SDK }}/build-tools/34.0.0/aapt
          D8: ${{ env.ANDROID_SDK }}/build-tools/34.0.0/d8
          ZIPALIGN: ${{ env.ANDROID_SDK }}/build-tools/34.0.0/zipalign
          APKSIGNER: ${{ env.ANDROID_SDK }}/build-tools/34.0.0/apksigner
        run: |
          VERSION_NAME="${{ steps.v.outputs.name }}" VERSION_CODE="${{ steps.v.outputs.code }}" bash build-apk.sh

      - name: 校验签名指纹（必须与仓库固定证书一致）
        run: |
          GOT=$(ls dist/*.apk | head -1)
          FOUND=$("${ANDROID_SDK}/build-tools/34.0.0/apksigner" verify --print-certs "$GOT" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          EXPECT="05d1265d870c5b72e53c8a745dbe8fe12edb791ea17f7bdaf40234904c4d5057"
          echo "签名: $FOUND"
          echo "期望: $EXPECT"
          if [ "$FOUND" != "$EXPECT" ]; then
            echo "::error::签名指纹不一致，会破坏覆盖安装。检查 keystore/keystore.properties 与 keystore/zichuan-release.jks。"
            exit 1
          fi

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: zichuan-assistant-${{ steps.v.outputs.name }}
          path: dist/*.apk

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: 子川助手 v${{ steps.v.outputs.name }}
          body: |
            固定签名：SHA-256 `05d1265d870c5b72e53c8a745dbe8fe12edb791ea17f7bdaf40234904c4d5057`
            可直接覆盖安装旧版本，无需卸载。
          files: dist/*.apk