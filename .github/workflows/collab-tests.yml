name: Collab tests

# 只跑「协作聊天改造」这一批测试：上下文检索、输入栏遮挡几何、面板定位、
# 顺序回答、会话切换。既有 Android 构建流程不动（android.yml）。
on:
  push:
    branches: [ ui-chuan-shui ]
    paths:
      - 'app/lib/collab/**'
      - 'app/lib/council/**'
      - 'app/lib/team/**'
      - 'app/lib/ui/collab/**'
      - 'app/lib/ui/council/**'
      - 'app/lib/ui/team/**'
      - 'app/lib/ui/chat/**'
      - 'app/lib/ui/shell/**'
      - 'app/lib/ui/tasks/**'
      - 'app/lib/state/conversation_mode_state.dart'
      - 'app/test/collab/**'
      - 'app/test/council/**'
      - 'app/test/chat/conversation_mode_switcher_test.dart'
      - '.github/workflows/collab-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Install CJK fonts for widget tests
        # test/flutter_test_config.dart 对字体是严格的：缺 Noto Sans CJK 就直接
        # 判失败（不悄悄画方框）。runner 默认没有这套字体，这里装上；Ubuntu 把
        # 它放在 opentype/noto，测试通过 DSH_TEST_FONT_DIR 读这个目录。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
          FONT_DIR="$(dirname "$(ls /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc 2>/dev/null || ls /usr/share/fonts/truetype/noto-cjk/NotoSansCJK-Regular.ttc)")"
          echo "font dir: $FONT_DIR"
          ls "$FONT_DIR" | grep -i 'NotoSansCJK-\(Light\|Regular\|Bold\)'
          echo "DSH_TEST_FONT_DIR=$FONT_DIR" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze changed areas
        run: |
          flutter analyze lib/collab lib/council lib/team lib/ui/collab lib/ui/council lib/ui/team \
            lib/ui/chat/shared lib/state/conversation_mode_state.dart || true
          flutter analyze test/collab test/chat/conversation_mode_switcher_test.dart || true

      - name: Context pack
        run: flutter test test/collab/collab_context_pack_test.dart --reporter expanded

      - name: Composer overlap geometry
        run: flutter test test/collab/composer_overlap_test.dart --reporter expanded

      - name: Mode panel anchor
        run: flutter test test/collab/conversation_mode_panel_test.dart --reporter expanded

      - name: Strict serial execution
        run: flutter test test/collab/team_serial_execution_test.dart --reporter expanded

      - name: Council sequential answers
        run: flutter test test/collab/council_sequential_test.dart --reporter expanded

      - name: Conversation routing
        run: flutter test test/collab/conversation_nav_test.dart --reporter expanded

      - name: Run keepalive
        run: flutter test test/collab/run_keepalive_test.dart --reporter expanded

      - name: Review and summarize serial
        run: flutter test test/collab/team_review_serial_test.dart --reporter expanded

      - name: Thinking state
        run: flutter test test/collab/thinking_state_test.dart --reporter expanded

      - name: Task context pack
        run: flutter test test/collab/collab_task_context_test.dart --reporter expanded

      - name: Unified composer
        run: flutter test test/collab/composer_unified_test.dart --reporter expanded

      - name: Page transitions
        run: flutter test test/collab/conversation_transition_test.dart --reporter expanded

      - name: Team session restore
        run: flutter test test/collab/team_session_restore_test.dart --reporter expanded

      - name: GitHub delivery
        run: flutter test test/collab/github_delivery_test.dart --reporter expanded

      - name: Stop really cancels
        run: flutter test test/collab/collab_stop_test.dart --reporter expanded

      - name: Mode switching keeps session
        run: flutter test test/chat/conversation_mode_switcher_test.dart --reporter expanded

      - name: Existing council tests
        run: flutter test test/council --reporter expanded
